name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kod
        uses: actions/checkout@v4

      - name: JDK 17 kur (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Bozuk gradlew dosyasını kaldır
        run: rm -f gradlew gradlew.bat

      - name: Gradle 8.2 kur
        run: |
          GRADLE_VERSION=8.2
          curl -fsSL https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          ln -sf /opt/gradle-${GRADLE_VERSION}/bin/gradle /usr/local/bin/gradle
          rm -f /tmp/gradle.zip

      - name: Gradle sürüm kontrolü
        run: gradle --version

      - name: Debug APK derle
        run: gradle :app:assembleDebug --stacktrace

      - name: APK artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: custom-car-os-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
