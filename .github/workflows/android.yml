name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kod
        uses: actions/checkout@v4

      - name: JDK 17 kur (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK ortamını ayarla
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la $ANDROID_HOME 2>&1 || echo "ANDROID_HOME yok"
          ls -la /usr/local/lib/android/sdk 2>&1 || echo "/usr/local/lib/android/sdk yok"

      - name: Bozuk gradlew dosyasını kaldır
        run: rm -f gradlew gradlew.bat

      - name: Gradle 8.2 kur
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          ln -sf /opt/gradle-8.2/bin/gradle /usr/local/bin/gradle
          rm -f /tmp/gradle.zip

      - name: Gradle sürüm kontrolü
        run: gradle --version

      - name: Debug APK derle (detayli log)
        run: gradle :app:assembleDebug --stacktrace --info 2>&1 | tee build.log

      - name: Hata mesajini goster
        if: failure()
        run: grep -i "error\|exception\|failed\|what went wrong" build.log | head -30

      - name: APK artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: custom-car-os-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
