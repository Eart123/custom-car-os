android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=false

# Kotlin — run compiler in-process to avoid Gradle worker crashes in CI
kotlin.code.style=official
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvm.options=-Xmx4g
kotlin.incremental=false

# Android
android.compileSdk=34
android.minSdk=21
android.targetSdk=34
android.javaVersion=11

# JVM
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Enable vector drawable support for older APIs
android.aapt2.enable=true

# Compose
android.buildfeatures.compose=true

# R8 / shrinker
android.enableR8=true