name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kod
        uses: actions/checkout@v4

      - name: JDK 17 kur (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle wrapper kontrol et
        run: |
          echo "=== gradlew var mi? ==="
          ls -la gradlew 2>&1 || echo "gradlew YOK"
          echo "=== gradle wrapper klasoru ==="
          ls -la gradle/wrapper/ 2>&1 || echo "gradle/wrapper YOK"
          echo "=== gradlew satir sayisi ==="
          wc -l gradlew 2>&1 || echo "gradlew okunamadi"
          echo "=== gradlew ilk satir ==="
          head -1 gradlew 2>&1 || echo "gradlew okunamadi"

      - name: Gradle wrapper düzelt (CRLF temizleme + izin)
        run: |
          if [ -f gradlew ]; then
            sed -i 's/\r$//' gradlew
            chmod +x gradlew
          else
            echo "gradlew dosyasi bulunamadi, Gradle wrapper indirilecek"
            GRADLE_VERSION=8.2
            curl -fsSL https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp
            ln -sf /tmp/gradle-${GRADLE_VERSION}/bin/gradle /usr/local/bin/gradle
            ln -sf /tmp/gradle-${GRADLE_VERSION}/bin/gradlew /usr/local/bin/gradlew
          fi

      - name: Gradle version kontrol et
        run: |
          if [ -f gradlew ]; then
            bash ./gradlew --version
          else
            gradle --version
          fi

      - name: Debug APK derle
        run: |
          if [ -f gradlew ]; then
            bash ./gradlew :app:assembleDebug --stacktrace
          else
            gradle :app:assembleDebug --stacktrace
          fi

      - name: APK artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: custom-car-os-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
