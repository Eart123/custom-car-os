name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kod
        uses: actions/checkout@v4

      - name: JDK 17 kur (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK ortamini ayarla
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Bozuk gradlew dosyasini kaldir
        run: rm -f gradlew gradlew.bat

      - name: Gradle 8.2 kur
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          ln -sf /opt/gradle-8.2/bin/gradle /usr/local/bin/gradle
          rm -f /tmp/gradle.zip

      - name: Gradle surum kontrolu
        run: gradle --version

      - name: Debug APK derle (detayli log)
        run: gradle :app:assembleDebug --stacktrace --info 2>&1 | tee build.log

      - name: Hata mesajini goster
        if: failure()
        run: grep -i -A5 "error\|exception\|failed\|what went wrong\|e: " build.log | head -50

      - name: APK dosyasini bul
        if: success()
        run: |
          echo "=== Tum APK dosyalari araniyor ==="
          find . -name "*.apk" -type f 2>/dev/null || echo "APK bulunamadi"
          APK_PATH=$(find . -name "app-debug.apk" -type f 2>/dev/null | head -1)
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV

      - name: APK artifact olarak yukle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: custom-car-os-debug-apk
          path: ${{ env.APK_PATH }}
          retention-days: 7