name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kod
        uses: actions/checkout@v4

      - name: JDK 17 kur (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK paketlerini kur
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          yes | $ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager --sdk_root=$ANDROID_HOME --licenses
          $ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Gradle izni ver
        run: chmod +x gradlew

      - name: Debug APK derle
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: ./gradlew :app:assembleDebug

      - name: APK artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: custom-car-os-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
