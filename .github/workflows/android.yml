name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kod
        uses: actions/checkout@v4

      - name: JDK 17 kur (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle wrapper tanılama
        run: |
          echo "=== dosya var mi? ==="
          ls -la gradlew
          echo "=== dosya tipi ==="
          file gradlew
          echo "=== ilk 5 satir ==="
          head -5 gradlew
          echo "=== satır sonları ==="
          file gradlew | grep -o "CRLF\|LF" || true

      - name: Gradle wrapper düzelt ve çalıştırma izni ver
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Gradle sürümünü kontrol et
        run: bash ./gradlew --version

      - name: Debug APK derle
        run: bash ./gradlew :app:assembleDebug --stacktrace

      - name: APK artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: custom-car-os-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
